server:
  port: 8080
spring:
  application:
    name: dms
  datasource:
    url: jdbc:h2:file:./data/dms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true
  h2:
    console:
      enabled: true
      path: /h2
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
logging:
  level:
    com.dms: info
dms:
  auth:
    jwt-secret: ${DMS_JWT_SECRET:}    # 生产必须配置；留空则启动时生成随机密钥，重启后旧 token 失效
    expire-hours: 12
    bootstrap-admin-password: ${DMS_ADMIN_PASSWORD:}  # 首次启动(sys_user 为空)创建 admin 的密码；留空则随机生成并打印日志
    ip-max-per-minute: ${DMS_AUTH_IP_MAX_PER_MINUTE:30}  # 每 IP 每分钟登录限流；0 关闭
    captcha-mode: ${DMS_AUTH_CAPTCHA_MODE:ADAPTIVE}      # OFF | ADAPTIVE(失败>=3次后要求) | ALWAYS
    trust-proxy: ${DMS_AUTH_TRUST_PROXY:false}           # true 时用 X-Forwarded-For 首个 IP 作为客户端地址
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  tax:
    provider: MOCK          # MOCK | HTTP
    mock-fail-rate: 0       # MockTaxAdapter 模拟失败概率 0~1
    endpoint: http://localhost:9999/tax
    app-id: dms-app
    app-secret: change-me
    sign-mode: HMAC         # HMAC(X-Sign 签名) | SECRET_HEADER(明文 X-App-Secret)
    timeout-ms: 10000       # 连接+读取超时
    callback-url: ""        # 写入请求报文，供平台异步回调
    callback-token: ""        # 非空时回调需携带 X-Tax-Callback-Token 头
  oms:
    mock: ${DMS_OMS_MOCK:true}          # true: 内存模拟 OMS(查询一次状态前进一步);false: HTTP 调用 OMS
    base-url: ${DMS_OMS_URL:http://localhost:8081}
    api-key: ${DMS_OMS_API_KEY:oms-open-key}
    shop-code: SHOP-DMS01               # OMS 中代表经销商备件渠道的店铺
    receive-location: RCV-01            # 补货入库默认库位
    timeout-ms: 5000
    callback-key: ${DMS_OMS_CALLBACK_KEY:}  # 非空时 OMS 回推 /api/open/oms/orders/status 需携带同值 X-Api-Key
  open:
    api-key: ${DMS_OPEN_API_KEY:dms-open-key}
  crm:
    cron: ${DMS_CRM_CRON:0 0 8 * * ?}        # 跟进任务每日自动生成
  report:
    daily-cron: ${DMS_REPORT_DAILY_CRON:0 30 23 * * ?}   # 经营日报每日生成（当晚 23:30）
    daily-recalc-cron: ${DMS_REPORT_DAILY_RECALC_CRON:0 10 0 * * ?}  # 次日凌晨重算昨日日报，补齐夜间业务
    pdf-font: ${DMS_REPORT_PDF_FONT:}        # PDF 中文字体文件路径；空则自动探测系统字体
  notify:
    provider: ${DMS_NOTIFY_PROVIDER:MOCK}   # MOCK | HTTP
    mock-fail-rate: 0                       # Mock 通道模拟失败概率 0~1
    timeout-ms: 10000
    sms:
      endpoint: ${DMS_NOTIFY_SMS_ENDPOINT:}
      app-id: ${DMS_NOTIFY_SMS_APP_ID:}
      app-secret: ${DMS_NOTIFY_SMS_APP_SECRET:}
      sign-name: DMS经销商
    wechat:
      endpoint: ${DMS_NOTIFY_WECHAT_ENDPOINT:}
      app-id: ${DMS_NOTIFY_WECHAT_APP_ID:}
      app-secret: ${DMS_NOTIFY_WECHAT_APP_SECRET:}
      template-id: ${DMS_NOTIFY_WECHAT_TEMPLATE_ID:}
---
spring:
  config:
    activate:
      on-profile: prod
  sql:
    init:
      data-locations: classpath:data-prod.sql
  h2:
    console:
      enabled: false
---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DMS_DB_URL:jdbc:mysql://localhost:3306/dms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DMS_DB_USER:root}
    password: ${DMS_DB_PASSWORD:root}
    hikari:
      maximum-pool-size: ${DMS_DB_POOL:10}
  sql:
    init:
      schema-locations: classpath:schema-mysql.sql
