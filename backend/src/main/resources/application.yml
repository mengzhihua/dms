server:
  port: 8080
spring:
  application:
    name: dms
  datasource:
    url: jdbc:h2:file:./data/dms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true
  h2:
    console:
      enabled: true
      path: /h2
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
logging:
  level:
    com.dms: info
dms:
  auth:
    jwt-secret: ${DMS_JWT_SECRET:}    # 生产必须配置；留空则启动时生成随机密钥，重启后旧 token 失效
    expire-hours: 12
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  tax:
    provider: MOCK          # MOCK | HTTP
    mock-fail-rate: 0       # MockTaxAdapter 模拟失败概率 0~1
    endpoint: http://localhost:9999/tax
    app-id: dms-app
    app-secret: change-me
    callback-token: ""        # 非空时回调需携带 X-Tax-Callback-Token 头
  oms:
    mock: ${DMS_OMS_MOCK:true}          # true: 内存模拟 OMS(查询一次状态前进一步);false: HTTP 调用 OMS
    base-url: ${DMS_OMS_URL:}           # 如 http://localhost:8081
    api-key: ${DMS_OMS_API_KEY:}        # OMS 的 oms.open.api-key
    shop-code: SHOP-DMS01               # OMS 中代表经销商备件渠道的店铺
    receive-location: RCV-01            # 补货入库默认库位
    timeout-ms: 5000
    callback-key: ${DMS_OMS_CALLBACK_KEY:}  # 非空时 OMS 回推 /api/open/oms/orders/status 需携带同值 X-Api-Key
  open:
    api-key: ${DMS_OPEN_API_KEY:dms-open-key}
---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/dms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
