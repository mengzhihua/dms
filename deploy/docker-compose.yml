services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DMS_DB_PASSWORD:-root}
      MYSQL_DATABASE: dms
    volumes:
      - dms-mysql-data:/var/lib/mysql
      # 历史库升级脚本（全新库由 schema-mysql.sql 初始化，此目录无需内容）
      - ./mysql/upgrade:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${DMS_PROFILES:-prod,mysql}
      DMS_DB_URL: jdbc:mysql://mysql:3306/dms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DMS_DB_USER: root
      DMS_DB_PASSWORD: ${DMS_DB_PASSWORD:-root}
      DMS_JWT_SECRET: ${DMS_JWT_SECRET:?请在 .env 中配置 DMS_JWT_SECRET}
      DMS_ADMIN_PASSWORD: ${DMS_ADMIN_PASSWORD:-}
      JAVA_OPTS: -Xms256m -Xmx768m
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "${DMS_HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  dms-mysql-data:
